name: Release offline image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag, for example v1.2.3
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: igame
          POSTGRES_USER: igame
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U igame -d igame"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate tag and version
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "${RELEASE_TAG}" == "v${version}" ]] || {
            printf 'Release tag %s does not match VERSION v%s\n' "${RELEASE_TAG}" "${version}" >&2
            exit 1
          }
          git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null || {
            printf 'The manual release input must name an existing tag: %s\n' "${RELEASE_TAG}" >&2
            exit 1
          }
          bash ./scripts/check-release-contract.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            sdk/gamehub-js/package-lock.json
            web/package-lock.json

      - name: Install locked dependencies and test
        run: |
          make deps
          make lint
          make test

      - name: Audit locked Node dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          npm --prefix sdk/gamehub-js audit --audit-level=low
          npm --prefix web audit --audit-level=low

      - name: Scan reachable Go vulnerabilities
        shell: bash
        run: |
          set -Eeuo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Put Syft on PATH
        shell: bash
        run: echo "$(dirname '${{ steps.syft.outputs.cmd }}')" >> "${GITHUB_PATH}"

      - name: Build offline release archive and evidence
        run: bash ./scripts/release.sh

      - name: Prove clean Docker load retains image tag
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(cat VERSION)"
          image="igame:v${version}"
          archive="dist/igame-v${version}.tar.gz"
          docker image rm "${image}"
          gzip -dc "${archive}" | docker load
          test "$(docker image inspect --format '{{index .RepoTags 0}}' "${image}")" = "${image}"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${image}")" = "${version}"
          test "$(docker image inspect --format '{{.Architecture}}' "${image}")" = "amd64"
          test "$(docker image inspect --format '{{.Config.User}}' "${image}")" = "10001:10001"
          test "$(docker image inspect --format '{{ index .Config.Labels "io.igame.build.go-version" }}' "${image}")" = "1.26.6"
          container_id="$(docker create "${image}")"
          binary_dir="$(mktemp -d)"
          cleanup_binary() {
            docker rm --force "${container_id}" >/dev/null 2>&1 || true
            rm -rf -- "${binary_dir}"
          }
          trap cleanup_binary EXIT
          docker cp "${container_id}:/app/igame" "${binary_dir}/igame"
          mkdir -p "${binary_dir}/licenses"
          docker cp "${container_id}:/licenses/." "${binary_dir}/licenses"
          go version -m "${binary_dir}/igame" | grep -Fq 'go1.26.6'
          test -x "${binary_dir}/igame"
          test -r "${binary_dir}/licenses/web/package.json"
          test -r "${binary_dir}/licenses/web/package-lock.json"
          test -r "${binary_dir}/licenses/sdk/gamehub-js/package.json"
          test -r "${binary_dir}/licenses/sdk/gamehub-js/package-lock.json"
          test -r "${binary_dir}/licenses/phaser/package.json"
          test -r "${binary_dir}/licenses/phaser/LICENSE.md"
          grep -Fq "\"version\": \"${version}\"" "${binary_dir}/licenses/web/package.json"
          grep -Fq "\"version\": \"${version}\"" "${binary_dir}/licenses/sdk/gamehub-js/package.json"
          grep -Fq '"node_modules/phaser"' "${binary_dir}/licenses/web/package-lock.json"
          grep -Fq '"name": "phaser"' "${binary_dir}/licenses/phaser/package.json"
          grep -iq MIT "${binary_dir}/licenses/phaser/LICENSE.md"

      - name: Scan final runtime image
        uses: anchore/scan-action@0d444ed77d83ee2ba7f5ced0d90d640a1281d762 # v7.3.0
        with:
          image: igame:${{ env.RELEASE_TAG }}
          fail-build: true
          severity-cutoff: high
          grype-version: v0.117.0
          output-format: table

      - name: Smoke-test loaded image
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(cat VERSION)"
          cookie_jar="$(mktemp)"
          data_volume="igame-ci-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container_id="$(docker run --detach --init --network host \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 256 \
            --volume "${data_volume}:/app/data" \
            --env 'POSTGRES_DSN=postgres://igame:ci-only-password@127.0.0.1:5432/igame?sslmode=disable' \
            --env 'BOOTSTRAP_ADMIN=ci-admin' \
            --env 'BOOTSTRAP_ADMIN_PASSWORD=ci-only-bootstrap-password' \
            --env 'ENCRYPTION_KEY=01234567890123456789012345678901' \
            "igame:v${version}")"
          cleanup() {
            docker logs "${container_id}" || true
            docker rm --force "${container_id}" >/dev/null 2>&1 || true
            docker volume rm "${data_volume}" >/dev/null 2>&1 || true
            rm -f -- "${cookie_jar}"
          }
          trap cleanup EXIT
          ready=false
          for attempt in {1..30}; do
            if bash ./scripts/smoke-test.sh http://127.0.0.1:8080; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "${ready}" == true ]]

          DEFENSE_TEST_DSN='postgres://igame:ci-only-password@127.0.0.1:5432/igame?sslmode=disable' \
            go test ./internal/api -run '^TestDefensePublishedSeedContract$' -count=1

          docker run --rm --network host \
            --env 'PGPASSWORD=ci-only-password' postgres:17-alpine \
            psql --no-psqlrc --host 127.0.0.1 --username igame --dbname igame \
            --set ON_ERROR_STOP=1 --command "
              UPDATE users SET team='release-alpha' WHERE username='ci-admin';
              INSERT INTO users(username,display_name,team,role,password_hash,status)
                SELECT 'ci-manager-same','CI same-team manager','release-alpha','manager',password_hash,'active' FROM users WHERE username='ci-admin'
                ON CONFLICT(username) DO UPDATE SET team=excluded.team,role=excluded.role,password_hash=excluded.password_hash,status='active';
              INSERT INTO users(username,display_name,team,role,password_hash,status)
                SELECT 'ci-manager-empty','CI unassigned manager','','manager',password_hash,'active' FROM users WHERE username='ci-admin'
                ON CONFLICT(username) DO UPDATE SET team=excluded.team,role=excluded.role,password_hash=excluded.password_hash,status='active';
              INSERT INTO users(username,display_name,team,role,password_hash,status)
                SELECT 'ci-manager-other','CI other-team manager','release-beta','manager',password_hash,'active' FROM users WHERE username='ci-admin'
                ON CONFLICT(username) DO UPDATE SET team=excluded.team,role=excluded.role,password_hash=excluded.password_hash,status='active';"

          curl --fail --silent --show-error --cookie-jar "${cookie_jar}" \
            --header 'Content-Type: application/json' \
            --data '{"username":"ci-admin","password":"ci-only-bootstrap-password"}' \
            http://127.0.0.1:8080/api/v1/auth/login >/dev/null
          curl --fail --silent --show-error --cookie "${cookie_jar}" \
            http://127.0.0.1:8080/api/v1/me >/dev/null
          bash ./scripts/smoke-realmguard.sh \
            http://127.0.0.1:8080 ci-admin ci-only-bootstrap-password
          IGAME_MANAGER_SAME_USERNAME=ci-manager-same \
          IGAME_MANAGER_SAME_PASSWORD=ci-only-bootstrap-password \
          IGAME_MANAGER_EMPTY_USERNAME=ci-manager-empty \
          IGAME_MANAGER_EMPTY_PASSWORD=ci-only-bootstrap-password \
          IGAME_MANAGER_OTHER_USERNAME=ci-manager-other \
          IGAME_MANAGER_OTHER_PASSWORD=ci-only-bootstrap-password \
          IGAME_SMOKE_POSTGRES_DSN='postgres://igame:ci-only-password@127.0.0.1:5432/igame?sslmode=disable' \
            bash ./scripts/smoke-defense-series.sh \
              http://127.0.0.1:8080 ci-admin ci-only-bootstrap-password
          for endpoint in dashboard analytics settings games categories users seasons events tournaments achievements rewards notices banners rankings workflow/requests audit; do
            curl --fail --silent --show-error --cookie "${cookie_jar}" \
              "http://127.0.0.1:8080/api/v1/admin/${endpoint}" >/dev/null
          done
          docker run --rm --network host \
            --env 'IGAME_BASE_URL=http://127.0.0.1:8080' \
            --env 'IGAME_USERNAME=ci-admin' \
            --env 'IGAME_PASSWORD=ci-only-bootstrap-password' \
            --env 'IGAME_REQUIRE_DESIGNER_DRAFT=true' \
            --env 'IGAME_REQUIRE_DEFENSE_DRAFT=true' \
            --env PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            --volume "${GITHUB_WORKSPACE}:/work:ro" \
            --workdir /tmp \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'set -Eeuo pipefail; mkdir -p browser-smoke && cd browser-smoke && npm init -y >/dev/null && npm install --silent --no-save playwright@1.55.0 && node /work/scripts/browser-smoke.mjs'
          curl --fail --silent --show-error --request PUT --cookie "${cookie_jar}" \
            --header 'Content-Type: application/json' \
            --data '{"current_password":"ci-only-bootstrap-password","new_password":"ci-rotated-bootstrap-password"}' \
            http://127.0.0.1:8080/api/v1/me/password >/dev/null
          curl --fail --silent --show-error --cookie-jar "${cookie_jar}" \
            --header 'Content-Type: application/json' \
            --data '{"username":"ci-admin","password":"ci-rotated-bootstrap-password"}' \
            http://127.0.0.1:8080/api/v1/auth/login >/dev/null

      - name: Record supply-chain evidence
        id: evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(cat VERSION)"
          archive="igame-v${version}.tar.gz"
          sbom="igame-v${version}.spdx.json"
          phaser_version="$(node -p "require('./web/node_modules/phaser/package.json').version")"
          sdk_version="$(node -p "require('./sdk/gamehub-js/package.json').version")"
          jq --exit-status --arg version "${phaser_version}" \
            '.packages[]? | select((.name | ascii_downcase) == "phaser" and .versionInfo == $version)' \
            "dist/${sbom}" >/dev/null
          jq --exit-status --arg version "${sdk_version}" \
            '.packages[]? | select(.name == "@igame/gamehub-js" and .versionInfo == $version)' \
            "dist/${sbom}" >/dev/null
          archive_sha="$(awk -v name="${archive}" '$2 == name {print $1}' dist/SHA256SUMS)"
          sbom_sha="$(awk -v name="${sbom}" '$2 == name {print $1}' dist/SHA256SUMS)"
          test -n "${archive_sha}"
          test -n "${sbom_sha}"
          echo "archive=dist/${archive}" >> "${GITHUB_OUTPUT}"
          echo "archive_sha=${archive_sha}" >> "${GITHUB_OUTPUT}"
          echo "sbom_sha=${sbom_sha}" >> "${GITHUB_OUTPUT}"
          {
            printf '## igame %s supply-chain evidence\n\n' "${RELEASE_TAG}"
            printf -- '- `%s` SHA-256: `%s`\n' "${archive}" "${archive_sha}"
            printf -- '- SPDX JSON SHA-256: `%s`\n' "${sbom_sha}"
            printf -- '- Archive format and retained tag verified with a clean `docker load`.\n'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Retain SBOM and checksum as workflow evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.RELEASE_TAG }}-supply-chain-evidence
          path: |
            dist/SHA256SUMS
            dist/*.spdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish the only release asset
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ steps.evidence.outputs.archive }}
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
          body: |
            Offline image: `igame:${{ env.RELEASE_TAG }}`

            `igame-${{ env.RELEASE_TAG }}.tar.gz` SHA-256: `${{ steps.evidence.outputs.archive_sha }}`

            SPDX JSON SBOM SHA-256: `${{ steps.evidence.outputs.sbom_sha }}` (SBOM and `SHA256SUMS` are retained as workflow evidence, not Release assets.)

      - name: Verify release contains only the Docker archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="igame-${RELEASE_TAG}.tar.gz"
          mapfile -t assets < <(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets[].name')
          if [[ ${#assets[@]} -ne 1 || "${assets[0]}" != "${expected}" ]]; then
            printf 'Release must contain exactly one asset named %s; found: %s\n' "${expected}" "${assets[*]:-none}" >&2
            exit 1
          fi
