name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            sdk/gamehub-js/package-lock.json
            web/package-lock.json

      - name: Install locked dependencies
        run: make deps

      - name: Verify release contract
        run: make check-contract

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build application
        run: make build

      - name: Build container
        run: make docker-build

      - name: Verify RealmGuard offline image contents
        shell: bash
        run: |
          set -Eeuo pipefail
          image="igame:v$(cat VERSION)"
          test "$(docker image inspect --format '{{.Architecture}}' "${image}")" = "amd64"
          docker run --rm --env "EXPECTED_VERSION=$(cat VERSION)" --entrypoint /bin/sh "${image}" -c \
            'test -x /app/igame && test -r /licenses/web/package.json && test -r /licenses/web/package-lock.json && test -r /licenses/sdk/gamehub-js/package.json && test -r /licenses/sdk/gamehub-js/package-lock.json && test -r /licenses/phaser/package.json && test -r /licenses/phaser/LICENSE.md && grep -Fq "\"version\": \"${EXPECTED_VERSION}\"" /licenses/web/package.json && grep -Fq "\"version\": \"${EXPECTED_VERSION}\"" /licenses/sdk/gamehub-js/package.json && grep -Fq "\"node_modules/phaser\"" /licenses/web/package-lock.json && grep -Fq "\"name\": \"phaser\"" /licenses/phaser/package.json && grep -iq MIT /licenses/phaser/LICENSE.md'
